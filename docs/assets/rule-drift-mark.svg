<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">RuleDrift mark</title>
  <desc id="description">Three horizontal rule lines, with the final line drifting down and ending at a checkpoint.</desc>
  <defs>
    <linearGradient id="background" x1="12" y1="8" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B4BDB"/>
      <stop offset="1" stop-color="#2D225F"/>
    </linearGradient>
    <linearGradient id="drift" x1="24" y1="61" x2="74" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFB454"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#background)"/>
  <path d="M24 30H72" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <path d="M24 47H72" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".82"/>
  <path d="M24 64H45C54 64 57 74 66 74H72" stroke="url(#drift)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="75" cy="74" r="7" fill="#FFB454" stroke="#2D225F" stroke-width="3"/>
</svg>
