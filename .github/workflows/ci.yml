name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm audit

  package-smoke:
    name: Package smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Exercise repository examples
        run: |
          npm run build
          node dist/bin.js validate --config examples/command/rule-drift.config.json
          node dist/bin.js test --config examples/command/rule-drift.config.json

      - name: Install and exercise packed package
        shell: bash
        run: |
          package_file=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          smoke_dir="$RUNNER_TEMP/rule-drift-smoke"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install "$RUNNER_TEMP/$package_file"
          npx rule-drift --version
          npx rule-drift init
          npx rule-drift validate
          node "$GITHUB_WORKSPACE/scripts/mcp-smoke.mjs" \
            "$smoke_dir/node_modules/.bin/rule-drift" \
            "$smoke_dir/node_modules/rule-drift/examples/command"
