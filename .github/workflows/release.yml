name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check

      - name: Verify tag matches package version
        run: |
          npm run versions
          node --eval "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"

      - name: Install verified MCP Registry publisher
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            --output "$archive"
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" mcp-publisher

      - name: Validate MCP Registry manifest
        run: |
          "$RUNNER_TEMP/mcp-publisher" validate

      - name: Create package archive
        id: pack
        shell: bash
        run: |
          package_file=$(npm pack --silent)
          echo "file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Attest package archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}

      - name: Publish to npm with provenance
        run: npm publish "${{ steps.pack.outputs.file }}" --access public --provenance

      - name: Publish to MCP Registry with GitHub OIDC
        shell: bash
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/mcp-publisher" publish; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --verify-tag --generate-notes
